# OneAgent 分布式测试集群配置
# 用于编排多个 OneAgent 实例的测试环境

version: '3.8'

services:
  # 主控节点 (RootOneAgent)
  root-0:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.test
    container_name: oneagent-root-0
    environment:
      - AGENT_TYPE=root
      - AGENT_ID=root-0
      - PORT=8000
      - LOG_LEVEL=DEBUG
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - oneagent-test-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 工作节点 1 (SubOneAgent)
  sub-0:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.test
    container_name: oneagent-sub-0
    environment:
      - AGENT_TYPE=sub
      - AGENT_ID=sub-0
      - PORT=8001
      - LOG_LEVEL=DEBUG
    ports:
      - "8001:8001"
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - oneagent-test-network
    depends_on:
      root-0:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 工作节点 2 (SubOneAgent)
  sub-1:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.test
    container_name: oneagent-sub-1
    environment:
      - AGENT_TYPE=sub
      - AGENT_ID=sub-1
      - PORT=8002
      - LOG_LEVEL=DEBUG
    ports:
      - "8002:8002"
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - oneagent-test-network
    depends_on:
      root-0:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 工作节点 3 (SubOneAgent)
  sub-2:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.test
    container_name: oneagent-sub-2
    environment:
      - AGENT_TYPE=sub
      - AGENT_ID=sub-2
      - PORT=8003
      - LOG_LEVEL=DEBUG
    ports:
      - "8003:8003"
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - oneagent-test-network
    depends_on:
      root-0:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  oneagent-test-network:
    driver: bridge
